<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Dictators</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="start-menu" hidden>
      <div class="panel">
        <h1>Little Dictators</h1>
        <div class="version">alpha</div>
        <div class="label">Map</div>
        <div class="map-list"></div>
        <button class="start">Start</button>
      </div>
      <div class="loading-note">Loading map…</div>
    </div>
    <div id="hud" hidden>
      <div class="title">Little Dictators</div>
      <div id="tile-info">Hover the map</div>
      <div class="help">Drag / WASD: move · Wheel / Q E: zoom · F: fit map</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
